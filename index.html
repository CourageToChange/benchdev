<!doctype html>
<html lang="en-GB">

  <title>BenchDev: How fast is this device?</title>
  <meta name="description" content="A local CPU and GPU benchmark with the working shown.">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./src/ui/app-browser.js"></script>

  <!-- Measured, not assumed. The module graph is 23 files deep and the browser cannot discover a
       module until it has parsed the one that imports it, so on a 150 ms link they arrived in FIVE
       sequential waves and LCP was 1840 ms against 44 ms on localhost. The waterfall is invisible
       on a fast connection, which is exactly why a localhost-only baseline would have concluded
       "change nothing" about the one condition that matters.
       These tell the browser about the whole graph from the first response, so the waves collapse.
       Generated from the real import graph by scripts/perf/generate-preloads.mjs, never typed:
       a hand-written list silently rots the first time someone adds an import. -->
  <link rel="modulepreload" href="./src/baselines.js">
  <link rel="modulepreload" href="./src/benchmark-browser.js">
